name: 构建并发布 GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Windows x64 / ${{ github.ref_name }}
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CAISHEN_SKIP_INTERACTIVE_TESTS: "1"

    steps:
      - name: 检查标签是否已有 Release
        id: release-state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            'exists=true' >> $env:GITHUB_OUTPUT
            Write-Host '该标签已有 Release，跳过自动重建和覆盖。'
          } else {
            'exists=false' >> $env:GITHUB_OUTPUT
          }

      - name: 检出标签源码
        if: steps.release-state.outputs.exists != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 校验标签与源码版本
        if: steps.release-state.outputs.exists != 'true'
        shell: pwsh
        run: |
          $header = Get-Content -LiteralPath src/common/version.h -Raw
          if ($header -notmatch '#define\s+SHURU_VERSION_STRING\s+"([^"]+)"') {
            throw 'src/common/version.h 缺少版本号'
          }
          $expectedTag = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "标签 $env:GITHUB_REF_NAME 与源码版本 $expectedTag 不一致"
          }

      - name: 配置 Python 3.11
        if: steps.release-state.outputs.exists != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: 配置 .NET 8
        if: steps.release-state.outputs.exists != 'true'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: 安装 NSIS 3
        if: steps.release-state.outputs.exists != 'true'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: 构建并验证 Setup 与 Portable
        if: steps.release-state.outputs.exists != 'true'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Config Release
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_portable.ps1 -SigningPolicy Off

      - name: 保存发行产物
        if: steps.release-state.outputs.exists != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CaishenPinyin-${{ github.ref_name }}-win-x64
          path: |
            artifacts/installer/CaishenPinyin-*-win-x64-Setup.exe
            artifacts/installer/CaishenPinyin-*-win-x64-Setup.exe.sha256
            artifacts/installer/CaishenPinyin-*-win-x64-Portable.zip
            artifacts/installer/CaishenPinyin-*-win-x64-Portable.zip.sha256
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: steps.release-state.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: 财神输入法 ${{ github.ref_name }}
          body: |
            > 本版本尚未进行 Authenticode 代码签名。UAC 会显示“未知发布者”，SmartScreen
            > 也可能告警。请只从本 Release 下载，并在运行前核对随附的 SHA-256。

            Setup 适合普通安装、升级和标准卸载；Portable 必须完整解压，并以管理员身份
            运行包内安装脚本。两种文件是同一版本的不同部署形式。
          files: |
            artifacts/installer/CaishenPinyin-*-win-x64-Setup.exe
            artifacts/installer/CaishenPinyin-*-win-x64-Setup.exe.sha256
            artifacts/installer/CaishenPinyin-*-win-x64-Portable.zip
            artifacts/installer/CaishenPinyin-*-win-x64-Portable.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
