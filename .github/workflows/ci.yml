name: Windows 构建与自动化测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows x64 / Release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 配置 .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: 配置 MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: 检查构建工具
        shell: pwsh
        run: |
          cmake --version
          if (Get-Command ninja -ErrorAction SilentlyContinue) { ninja --version }
          else { Write-Host 'Ninja 未安装，将使用 Visual Studio CMake Generator。' }
          dotnet --info
          python --version

      - name: 构建并运行自动化测试
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/build.ps1 -Config Release -SigningPolicy Off

      - name: 上传发行目录
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CaishenPinyin-${{ github.sha }}-win-x64
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
