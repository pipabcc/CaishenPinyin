name: Windows 构建与自动化测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows x64 / Release
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CAISHEN_SKIP_INTERACTIVE_TESTS: "1"

    steps:
      - name: 检出源码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 配置 Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: 配置 .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: 检查构建工具
        shell: pwsh
        run: |
          cmake --version
          if (Get-Command ninja -ErrorAction SilentlyContinue) { ninja --version }
          else { Write-Host 'Ninja 未安装，将使用 Visual Studio CMake Generator。' }
          dotnet --info
          python --version

      - name: 构建并运行自动化测试
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/build.ps1 -Config Release -SigningPolicy Off

      - name: 上传发行目录
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CaishenPinyin-${{ github.sha }}-win-x64
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
